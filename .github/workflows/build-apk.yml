name: Build APK

on:
  push:
    branches:
      - main
      - bmw-can-dev
  pull_request:
    branches:
      - main
      - bmw-can-dev
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/tmp/
          retention-days: 7

  notify:
    name: Build Status Notification
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Success
        if: needs.build.result == 'success'
        run: |
          echo "✅ APK build completed successfully!"
          echo "Download the APK from the artifacts section."

      - name: Build Failed
        if: needs.build.result == 'failure'
        run: |
          echo "❌ APK build failed!"
          echo "Check the logs in the 'Build APK' job for details."
          exit 1
