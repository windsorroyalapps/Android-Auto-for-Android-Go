name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: app/build/reports/

  notify:
    name: Build Status Notification
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Success
        if: needs.build.result == 'success'
        run: echo "✅ APK build completed successfully! Download from the artifacts."

      - name: Build Failed
        if: needs.build.result == 'failure'
        run: echo "❌ APK build failed. Check the logs for details."
