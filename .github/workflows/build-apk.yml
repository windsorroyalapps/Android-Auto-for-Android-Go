name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew || echo "gradlew not found, this may be expected"

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            gradle assembleDebug
          else
            echo "No build configuration found. Checking for Gradle wrapper..."
            gradle --version
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: |
            **/build/reports/
            **/build/tmp/

  notify:
    name: Build Status Notification
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Success
        if: needs.build.result == 'success'
        run: echo "✅ APK build completed successfully! Download from the artifacts."

      - name: Build Failed
        if: needs.build.result == 'failure'
        run: echo "❌ APK build failed. Check the logs for details."
